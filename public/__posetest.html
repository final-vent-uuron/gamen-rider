<!doctype html>
<html>
<body>
<pre id="log">START
</pre>
<script type="module">
const log = (s) => { document.getElementById('log').textContent += s + '\n' }
self.addEventListener('error', (e) => log('PAGE_ERROR: ' + e.message))
try {
  const w = new Worker(new URL('/src/battle/cameraGuard.worker.ts', location.origin), { type: 'module' })
  w.onmessage = (e) => log('WORKER_MSG: ' + JSON.stringify(e.data))
  w.onerror = (e) => log('WORKER_ERROR: ' + (e.message || 'unknown') + ' @' + (e.filename || '') + ':' + (e.lineno || ''))
  log('WORKER_SPAWNED')
} catch (e) {
  log('SPAWN_FAIL: ' + e.message)
}
</script>
</body>
</html>
